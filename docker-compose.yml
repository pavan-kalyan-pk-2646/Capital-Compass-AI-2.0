services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: capital_compass
      MYSQL_USER: compass
      MYSQL_PASSWORD: compass
      MYSQL_ROOT_PASSWORD: compass-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
